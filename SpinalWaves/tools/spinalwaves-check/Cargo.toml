[package]
name = "spinalwaves-check"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Check that a SpinalWaves HGLDD file resolves against a VCD (via tywaves-rs) and rewrite the VCD for surfer-tywaves."
publish = false

[dependencies]
tywaves-rs = { path = "../../third_party/tywaves-rs" }
vcd = "0.7.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
debug = false
