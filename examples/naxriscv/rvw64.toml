[suites.scheduled-wfi-3-0]
dir = "${NAX_SUITES_OUT}/scheduled"
glob = "scheduled-wfi-3-0.elf"
strip_suffix = ".elf"
configs = ["rv64imasu"]
max_cycles = 30000
timeout_s = 30
mem_latency = 0
options = { probes = true, irq_schedule = "1:0x0,1000:0x8,20000:0x0" }

