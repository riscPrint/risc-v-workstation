[core]
name = "vexriscv-formal"

[riscv_formal]
root = "${RISCV_FORMAL}"
wrapper = "wrapper.sv.in"
verilog = ["${RISCV_FORMAL}/cores/VexRiscv/VexRiscv.v"]
isa = "rv32ic"
nret = 1
checks = ["insn_add_ch0", "insn_addi_ch0", "insn_and_ch0", "insn_andi_ch0", "insn_auipc_ch0", "insn_beq_ch0", "insn_bge_ch0", "insn_bgeu_ch0", "insn_blt_ch0", "insn_bltu_ch0", "insn_bne_ch0", "insn_jal_ch0", "insn_jalr_ch0", "insn_lb_ch0", "insn_lbu_ch0", "insn_lh_ch0", "insn_lhu_ch0", "insn_lui_ch0", "insn_lw_ch0", "insn_or_ch0", "insn_ori_ch0", "insn_sb_ch0", "insn_sh_ch0", "insn_sll_ch0", "insn_slli_ch0", "insn_slt_ch0", "insn_slti_ch0", "insn_sltiu_ch0", "insn_sltu_ch0", "insn_sra_ch0", "insn_srai_ch0", "insn_srl_ch0", "insn_srli_ch0", "insn_sub_ch0", "insn_sw_ch0", "insn_xor_ch0", "insn_xori_ch0", "reg_ch0", "pc_fwd_ch0", "pc_bwd_ch0", "liveness_ch0", "unique_ch0", "causal_ch0", "cover"]
depth = 20
solver = "bitwuzla"
defines = ["`define RISCV_FORMAL_ALIGNED_MEM", "`define RISCV_FORMAL_ALTOPS", "`define DEBUGNETS"]

[riscv_formal.ports]
valid = "rvfi_valid"
order = "rvfi_order"
insn = "rvfi_insn"
trap = "rvfi_trap"
halt = "rvfi_halt"
intr = "rvfi_intr"
mode = "rvfi_mode"
ixl = "rvfi_ixl"
rs1_addr = "rvfi_rs1_addr"
rs2_addr = "rvfi_rs2_addr"
rs1_rdata = "rvfi_rs1_rdata"
rs2_rdata = "rvfi_rs2_rdata"
rd_addr = "rvfi_rd_addr"
rd_wdata = "rvfi_rd_wdata"
pc_rdata = "rvfi_pc_rdata"
pc_wdata = "rvfi_pc_wdata"
mem_addr = "rvfi_mem_addr"
mem_rmask = "rvfi_mem_rmask"
mem_wmask = "rvfi_mem_wmask"
mem_rdata = "rvfi_mem_rdata"
mem_wdata = "rvfi_mem_wdata"

[riscv_formal.check_options.insn_add_ch0]
cycles = [20]
engine = "abc bmc3"
