include = ['^rv64u[ima]-p-']
exclude = ['\.dump$', '^rv64ui-p-ma_data$']
configs = ["rv64imasu"]
max_cycles = 200000
timeout_s = 60
mem_latency = 0

[suites.act4-rv64]
description = "ACT4 RV64 MSU Sv39 standard-boot profile"
dir = "rvw/out/act4-rv64/work/rvw-act4/elfs"
act4_manifest = "rvw/out/act4-rv64/manifest.json"
glob = "**/*.elf"
strip_suffix = ".elf"
configs = ["rv64imasu"]
max_cycles = 2000000
timeout_s = 120
mem_latency = 0

[debug]
