name: Nightly (no BOOM)
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  python:
    runs-on: [self-hosted, macOS, ARM64, rvw-local]
    timeout-minutes: 125
    strategy:
      fail-fast: false
      matrix:
        part: ["0/4", "1/4", "2/4", "3/4"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run tier
        env:
          CI_COMPONENT: python
          CI_SHARD: ${{ matrix.part }}
        run: scripts/ci-local.sh --tier nightly
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: rvw/out/ci
          retention-days: 7
          if-no-files-found: ignore
      - name: Job result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: echo "Job status = $JOB_STATUS. Test counts require a completed test report." >> "$GITHUB_STEP_SUMMARY"
  scala:
    runs-on: [self-hosted, macOS, ARM64, rvw-local]
    timeout-minutes: 125
    strategy:
      fail-fast: false
      matrix:
        part: ["SpinalWaves/spinalwaves", "SpinalTrace/spinaltrace", "SpinalDB/spinaldb", "SpinalChecks", "SpinalKonata", "SpinalBlocks/spinalblocks", "RiscvSim", "SpinalProbes", "SpinalSoc"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run tier
        env:
          CI_COMPONENT: scala
          CI_SCALA_PROJECT: ${{ matrix.part }}
        run: scripts/ci-local.sh --tier nightly
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: rvw/out/ci
          retention-days: 7
          if-no-files-found: ignore
      - name: Job result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: echo "Job status = $JOB_STATUS. Test counts require a completed test report." >> "$GITHUB_STEP_SUMMARY"
  other:
    runs-on: [self-hosted, macOS, ARM64, rvw-local]
    timeout-minutes: 125
    strategy:
      fail-fast: false
      matrix:
        part: ["rust", "javascript", "components", "vip"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run tier
        env:
          CI_COMPONENT: ${{ matrix.part }}
        run: scripts/ci-local.sh --tier nightly
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: rvw/out/ci
          retention-days: 7
          if-no-files-found: ignore
      - name: Job result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: echo "Job status = $JOB_STATUS. Test counts require a completed test report." >> "$GITHUB_STEP_SUMMARY"
  native-light:
    runs-on: [self-hosted, macOS, ARM64, rvw-local]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: scripts/ci-local.sh --tier native-light
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: rvw/out/ci
          retention-days: 7
          if-no-files-found: ignore
      - name: Job result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: echo "Job status = $JOB_STATUS. Test counts require a completed test report." >> "$GITHUB_STEP_SUMMARY"
  examples:
    runs-on: [self-hosted, macOS, ARM64, rvw-local]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: scripts/ci-local.sh --tier examples
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: rvw/out/ci
          retention-days: 7
          if-no-files-found: ignore
      - name: Job result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: echo "Job status = $JOB_STATUS. Test counts require a completed test report." >> "$GITHUB_STEP_SUMMARY"
