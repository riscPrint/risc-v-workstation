name: Nightly (no BOOM)
on:
  schedule:
    # 03:23 GMT / 04:23 BST, both at night in Europe/London.
    - cron: '23 3 * * *'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
permissions:
  contents: read
jobs:
  python:
    runs-on: [self-hosted, macOS, rvw-local]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '21'
      - uses: sbt/setup-sbt@e9efd6df90910bb94a11ccbb1541acd9e657c1c5
      - name: Run isolated local checks
        run: scripts/ci-local.sh nightly-python
  scala:
    runs-on: [self-hosted, macOS, rvw-local]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '21'
      - uses: sbt/setup-sbt@e9efd6df90910bb94a11ccbb1541acd9e657c1c5
      - name: Run isolated local checks
        run: scripts/ci-local.sh nightly-scala
