name: Native installer
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/install.sh'
      - 'rvw/uv.lock'
      - '.github/workflows/installer.yml'
      - 'Cosim/build.sh'
      - 'docs/TOOL_VERSIONS.md'
      - 'docs/INSTALL_TESTED.md'
  schedule:
    - cron: '23 4 * * 1'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        flags:
          - ''
          - '--with-sim'
          - '--with-riscv-gcc'
          - '--with-cosim'
          - '--with-formal'
          - '--with-sim --with-riscv-gcc --with-cosim'
    steps:
      - uses: actions/checkout@v4
      - name: Install on the native host
        env:
          FLAGS: ${{ matrix.flags }}
        run: |
          read -r -a flags <<< "$FLAGS"
          scripts/install.sh --yes "${flags[@]}"
      - name: Check requested tools
        env:
          FLAGS: ${{ matrix.flags }}
        run: |
          source env.sh
          read -r -a flags <<< "$FLAGS"
          scripts/install.sh --check "${flags[@]}"
      - name: Check the pinned reference policies
        if: contains(matrix.flags, '--with-cosim') && contains(matrix.flags, '--with-riscv-gcc')
        run: |
          source env.sh
          rvw/.venv/bin/python -m pytest rvw/tests/cosim/test_reference_mmu.py rvw/tests/cosim/test_platform_policy.py -q
  long-install:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        flags: ['--with-gem5', '--all']
    steps:
      - uses: actions/checkout@v4
      - name: Install on the native host
        env:
          FLAGS: ${{ matrix.flags }}
        run: |
          read -r -a flags <<< "$FLAGS"
          scripts/install.sh --yes "${flags[@]}"
      - name: Check requested tools
        env:
          FLAGS: ${{ matrix.flags }}
        run: |
          source env.sh
          read -r -a flags <<< "$FLAGS"
          scripts/install.sh --check "${flags[@]}"
