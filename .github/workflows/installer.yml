name: Native installer
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/installer.yml'
      - 'scripts/install*.sh'
      - 'rvw/pyproject.toml'
      - 'rvw/uv.lock'
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        flags:
          - ''
          - '--with-sim'
          - '--with-riscv-gcc'
          - '--with-cosim'
          - '--with-formal'
          - '--with-sim --with-riscv-gcc --with-cosim'
    steps:
      - uses: actions/checkout@v4
      - name: Install on the native host
        env:
          FLAGS: ${{ matrix.flags }}
        run: |
          read -r -a flags <<< "$FLAGS"
          scripts/install.sh --yes "${flags[@]}"
      - name: Check requested tools
        env:
          FLAGS: ${{ matrix.flags }}
        run: |
          source env.sh
          read -r -a flags <<< "$FLAGS"
          scripts/install.sh --check "${flags[@]}"
  long-install:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        flags: ['--with-gem5', '--all']
    steps:
      - uses: actions/checkout@v4
      - name: Install on the native host
        env:
          FLAGS: ${{ matrix.flags }}
        run: |
          read -r -a flags <<< "$FLAGS"
          scripts/install.sh --yes "${flags[@]}"
      - name: Check requested tools
        env:
          FLAGS: ${{ matrix.flags }}
        run: |
          source env.sh
          read -r -a flags <<< "$FLAGS"
          scripts/install.sh --check "${flags[@]}"
