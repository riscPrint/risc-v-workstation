name: Native installer
# Keep disabled until a Linux self-hosted runner is available.
# GitHub-hosted Ubuntu requires paid minutes for this private repository.
on:
  workflow_dispatch:
    inputs:
      long_builds:
        description: Also run the gem5 and all-tools builds (up to six hours each)
        type: boolean
        default: false
      cosim_only:
        description: Run only the cosim installer and shim capture tests
        type: boolean
        default: false
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read
jobs:
  install:
    runs-on: [self-hosted, Linux, X64, rvw-linux]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.cosim_only && '["cosim"]' || '["core", "sim", "gcc", "cosim", "formal", "quickstart"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Check install and native runtime
        env:
          CASE: ${{ matrix.case }}
        run: |
          python3 scripts/qualify-install.py --case "$CASE" \
            --timeout 3000 --out "$RUNNER_TEMP/install-$CASE-$GITHUB_RUN_ATTEMPT"
      - name: Retain case report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-${{ matrix.case }}
          path: |
            ${{ runner.temp }}/install-${{ matrix.case }}-${{ github.run_attempt }}/report.json
            ${{ runner.temp }}/install-${{ matrix.case }}-${{ github.run_attempt }}/*.log
            ${{ runner.temp }}/install-${{ matrix.case }}-${{ github.run_attempt }}/*.xml
  long-install:
    if: github.event_name == 'workflow_dispatch' && inputs.long_builds && !inputs.cosim_only
    runs-on: [self-hosted, Linux, X64, rvw-linux]
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        case: ['gem5', 'all']
    steps:
      - uses: actions/checkout@v4
      - name: Check install and native runtime
        env:
          CASE: ${{ matrix.case }}
        run: |
          python3 scripts/qualify-install.py --case "$CASE" \
            --timeout 18000 --out "$RUNNER_TEMP/install-$CASE-$GITHUB_RUN_ATTEMPT"
      - name: Retain case report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-${{ matrix.case }}
          path: |
            ${{ runner.temp }}/install-${{ matrix.case }}-${{ github.run_attempt }}/report.json
            ${{ runner.temp }}/install-${{ matrix.case }}-${{ github.run_attempt }}/*.log
            ${{ runner.temp }}/install-${{ matrix.case }}-${{ github.run_attempt }}/*.xml
