name: CI
on:
  push:
    branches: [main, p1/integration, p2/integration]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  changes:
    runs-on: [self-hosted, macOS, ARM64, rvw-local]
    timeout-minutes: 5
    outputs:
      python: ${{ steps.paths.outputs.python }}
      javascript: ${{ steps.paths.outputs.javascript }}
      rust: ${{ steps.paths.outputs.rust }}
      scala: ${{ steps.paths.outputs.scala }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ]; then
            python3 scripts/ci-paths.py --base "$BASE" --head "$HEAD"
          else
            python3 scripts/ci-paths.py
          fi
  fast:
    name: Fast
    needs: changes
    runs-on: [self-hosted, macOS, ARM64, rvw-local]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python fast set or release hygiene
        env:
          CI_HYGIENE_ONLY: ${{ needs.changes.outputs.python != 'true' }}
        run: scripts/ci-local.sh fast
  javascript:
    needs: changes
    if: needs.changes.outputs.javascript == 'true'
    runs-on: [self-hosted, macOS, ARM64, rvw-local]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: scripts/ci-local.sh javascript
  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: [self-hosted, macOS, ARM64, rvw-local]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: scripts/ci-local.sh rust
  scala:
    needs: changes
    if: needs.changes.outputs.scala == 'true'
    runs-on: [self-hosted, macOS, ARM64, rvw-local]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: scripts/ci-local.sh nightly-scala
