name: CI
on:
  push:
    branches: [main, p1/integration, p2/integration]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  changes:
    runs-on: [self-hosted, macOS, ARM64, rvw-local]
    timeout-minutes: 5
    outputs:
      python: ${{ steps.paths.outputs.python }}
      javascript: ${{ steps.paths.outputs.javascript }}
      rust: ${{ steps.paths.outputs.rust }}
      scala: ${{ steps.paths.outputs.scala }}
      scala_projects: ${{ steps.paths.outputs.scala_projects }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ]; then
            python3 scripts/ci-paths.py --base "$BASE" --head "$HEAD"
          else
            python3 scripts/ci-paths.py
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: rvw/out/ci
          retention-days: 7
          if-no-files-found: ignore
      - name: Job result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: echo "Job status = $JOB_STATUS. Test counts require a completed test report." >> "$GITHUB_STEP_SUMMARY"
  fast:
    name: Fast
    needs: changes
    if: always()
    runs-on: [self-hosted, macOS, ARM64, rvw-local]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python fast set or release hygiene
        env:
          SELECTION_STATUS: ${{ needs.changes.result }}
          CI_HYGIENE_ONLY: ${{ needs.changes.outputs.python != 'true' }}
        run: |
          test "$SELECTION_STATUS" = success
          scripts/ci-local.sh fast
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: rvw/out/ci
          retention-days: 7
          if-no-files-found: ignore
      - name: Job result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: echo "Job status = $JOB_STATUS. Test counts require a completed test report." >> "$GITHUB_STEP_SUMMARY"
  javascript:
    needs: changes
    if: needs.changes.outputs.javascript == 'true'
    runs-on: [self-hosted, macOS, ARM64, rvw-local]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: scripts/ci-local.sh javascript
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: rvw/out/ci
          retention-days: 7
          if-no-files-found: ignore
      - name: Job result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: echo "Job status = $JOB_STATUS. Test counts require a completed test report." >> "$GITHUB_STEP_SUMMARY"
  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: [self-hosted, macOS, ARM64, rvw-local]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: scripts/ci-local.sh rust
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: rvw/out/ci
          retention-days: 7
          if-no-files-found: ignore
      - name: Job result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: echo "Job status = $JOB_STATUS. Test counts require a completed test report." >> "$GITHUB_STEP_SUMMARY"
  scala:
    needs: changes
    if: needs.changes.outputs.scala == 'true'
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.changes.outputs.scala_projects) }}
    runs-on: [self-hosted, macOS, ARM64, rvw-local]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - env:
          CI_SCALA_PROJECT: ${{ matrix.project }}
        run: scripts/ci-local.sh nightly-scala
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: rvw/out/ci
          retention-days: 7
          if-no-files-found: ignore
      - name: Job result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: echo "Job status = $JOB_STATUS. Test counts require a completed test report." >> "$GITHUB_STEP_SUMMARY"
  linux:
    # Untested. Enable both Linux definitions with this one repository variable.
    if: vars.RVW_LINUX_CI == 'enabled'
    runs-on: ubuntu-latest
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install Python setup tool
        run: |
          python3 -m venv "$RUNNER_TEMP/rvw-ci-setup"
          "$RUNNER_TEMP/rvw-ci-setup/bin/python" -m pip install 'uv==0.13.6'
          echo "$RUNNER_TEMP/rvw-ci-setup/bin" >> "$GITHUB_PATH"
      - name: Install inventory apt packages (untested)
        env:
          CI_TIER: fast
        run: |
          echo 'Linux recipe is untested. Source-only tools can skip.' >> "$GITHUB_STEP_SUMMARY"
          packages=$(python3 scripts/ci-linux-plan.py --tier "$CI_TIER" --packages)
          if [ -n "$packages" ]; then
            sudo apt-get update
            sudo apt-get install -y $packages
          fi
      - name: Run tier (untested)
        env:
          CI_PYTHON: python3
          CI_TIER: fast
        run: scripts/ci-local.sh --tier "$CI_TIER"
      - name: Job result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: echo "Linux untested definition. Job status = $JOB_STATUS." >> "$GITHUB_STEP_SUMMARY"
