name: CI
on:
  push:
    branches: [main, p1/integration, p2/integration]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
permissions:
  contents: read
jobs:
  fast:
    name: Fast (macOS ARM64)
    runs-on: [self-hosted, macOS, ARM64, rvw-local]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '21'
      - uses: sbt/setup-sbt@e9efd6df90910bb94a11ccbb1541acd9e657c1c5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Run isolated local checks
        run: scripts/ci-local.sh fast
