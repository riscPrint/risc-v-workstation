[project]
name = "rvw"
version = "0.1.0a1"
description = "RISC-V Workstation command-line tools: regression, co-simulation, failure bundles, design queries, coverage, performance"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.18"]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
rvw = "rvw.cli:main"

[build-system]
requires = ["hatchling==1.30.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rvw"]
